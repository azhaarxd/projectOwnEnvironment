[main]
font=monospace:size=11
pad=14x14
initial-window-size-chars=100x30
initial-color-theme=dark

[colors-dark]
# Background alpha affects the background only; text stays fully opaque.
background=14161b
foreground=dcdfe4
alpha=0.72
alpha-mode=default
regular0=1c1e24
regular1=e06c75
regular2=98c379
regular3=e5c07b
regular4=61afef
regular5=c678dd
regular6=56b6c2
regular7=abb2bf
bright0=5c6370
bright1=e06c75
bright2=98c379
bright3=e5c07b
bright4=61afef
bright5=c678dd
bright6=56b6c2
bright7=ffffff
selection-foreground=ffffff
selection-background=3e4452

